# 模型后端配置: 在 agent.yaml 里用 model_config 指向本文件。
# /model <name> 切换; /models 列出全部。
#
# api_key 支持 ${ENV_VAR} 占位符。

default: qwen-local       # 启动时默认激活的模型

models:
  # ---- 本地小模型 (OpenAI 兼容协议) ----
  - name: qwen-local
    backend: openai
    model: CPM5-2B
    base_url: http://localhost:8080/v1
    api_key: ${OPENAI_API_KEY}    # llama.cpp / vllm 通常不校验, 写个占位符即可
    temperature: 0.7
    max_tokens: 2048
    timeout: 300
    stream: true

  # ---- 远程 API ----
  - name: deepseek
    backend: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    temperature: 0.7
    max_tokens: 2048
    timeout: 60
    stream: true

  - name: modelscope
    backend: openai
    model: Qwen/Qwen3.8-Flash-Next
    base_url: https://api-inference.modelscope.cn/v1
    api_key: ${MS_KEY}
    temperature: 0.7
    max_tokens: 4096
    timeout: 60
    stream: true

